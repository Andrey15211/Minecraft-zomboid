plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = 'er-bridge'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"erbridge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArgs '--username', 'Steve'
			// erbridge.disableOverlay: the overlay's SetWindowLongPtr ownership tricks crash
		// PZ's GLFW render thread (glfw.dll+0x10fa1 in lockStepRenderStep); Stage 3 needs
		// the link only, so MC runs as a normal window until the compositor stage.
		// The property also neutralizes WindowMixin's windowed-mode redirect.
		vmArgs '-Xms512m', '-Xmx3g', '-Derbridge.disableOverlay=true'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Foojay toolchain resolver plugin (settings.gradle) lets Gradle auto-download JDK 25
// when no local install matches; see settings.gradle.
